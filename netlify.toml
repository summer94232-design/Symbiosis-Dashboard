[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."fubon-snapshot"]
  node_bundler = "esbuild"
  external_node_modules = ["fubon-neo"]

[functions."fubon-history"]
  node_bundler = "esbuild"
  external_node_modules = ["fubon-neo"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
